<title>주방식 채굴 스케줄러</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 작업대 레이아웃: 왼쪽 입력판 + 오른쪽 3D·편 평면도·연차 계획. 갱내 측량도처럼 차분한 석회암 회색에 안전 주황 하나 */
:root{
  --bg:#eceeec; --panel:#f9faf9; --sunk:#e3e7e5; --ink:#1b2225; --muted:#5b676b; --line:#d3d9d6;
  --accent:#d9480f; --ore:#1f6f8b; --ramp:#3b4447; --scene:#dfe4e1; --ghost:#c5ccc9; --pillar:#8d9692; --bad:#c92a2a; --ok:#2f7d4f;
  --y0:#27346a; --y1:#2c7c97; --y2:#5db095; --y3:#e2c94f;
  --lvA:#b9cbd3; --lvB:#1f4e5f;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121618; --panel:#1a1f22; --sunk:#14191b; --ink:#e2e8e5; --muted:#95a19d; --line:#2b3337;
    --accent:#ff7b3a; --ore:#56b3d3; --ramp:#c9d1ce; --scene:#171c1f; --ghost:#353e42; --pillar:#6f7975; --bad:#ff6b6b; --ok:#5cc489;
    --y0:#4a5fb0; --y1:#3a9cb8; --y2:#6cc3a3; --y3:#f0d865;
    --lvA:#2f4a55; --lvB:#9fd0e0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121618; --panel:#1a1f22; --sunk:#14191b; --ink:#e2e8e5; --muted:#95a19d; --line:#2b3337;
  --accent:#ff7b3a; --ore:#56b3d3; --ramp:#c9d1ce; --scene:#171c1f; --ghost:#353e42; --pillar:#6f7975; --bad:#ff6b6b; --ok:#5cc489;
  --y0:#4a5fb0; --y1:#3a9cb8; --y2:#6cc3a3; --y3:#f0d865;
  --lvA:#2f4a55; --lvB:#9fd0e0;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}
.num,output,td,.kpi .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:12px}
header.top h1{font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
header.top p{margin:0;color:var(--muted);font-size:13px}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;padding:1px 7px;border-radius:999px;border:1px solid var(--accent);color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-bottom:8px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;min-width:0}
.kpi .k{font-size:11.5px;color:var(--muted)}
.kpi .v{font-size:19px;font-weight:500;white-space:nowrap}
.kpi .d{font-size:11.5px;color:var(--muted)}
.status{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);color:var(--muted)}
.chip.warn{border-color:var(--bad);color:var(--bad)}
.chip i{width:9px;height:9px;border-radius:2px;display:inline-block}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:12px;align-items:start}
aside.inputs{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:4px 12px 12px;position:sticky;top:max(8px,env(safe-area-inset-top,0px));max-height:calc(100vh - 16px);overflow:auto}
fieldset{border:0;border-top:1px solid var(--line);margin:8px 0 0;padding:8px 0 0}
fieldset:first-child{border-top:0}
legend{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--muted);padding:0}
.sl{display:grid;grid-template-columns:1fr 100px;grid-template-rows:auto auto;column-gap:8px;margin-top:6px}
.sl label{font-size:13px;grid-column:1}
.sl output{grid-column:2;grid-row:1;text-align:right;font-size:12.5px}
.sl input{grid-column:1/3;width:100%;margin:2px 0 0;accent-color:var(--accent)}
.derived{font-size:12px;color:var(--muted);margin-top:8px;background:var(--sunk);border-radius:4px;padding:6px 8px}
.derived b{color:var(--ink);font-weight:600}
.opt{display:flex;align-items:center;gap:6px;font-size:13px;margin-top:8px}
select{font:inherit;font-size:13px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:3px 6px}
main.work{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card h2{font-size:14px;font-weight:600;margin:0}
.card .head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;padding:10px 12px 0}
.card .sub{font-size:12px;color:var(--muted)}
.stage{position:relative;height:min(62vh,560px);min-height:340px;border-radius:var(--r) var(--r) 0 0;overflow:hidden;background:var(--scene)}
#view{width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;top:8px;left:8px;right:8px;display:flex;flex-wrap:wrap;gap:4px;pointer-events:none}
.hud>*{pointer-events:auto}
button,.tg{font:inherit;font-size:12.5px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:3px 9px;cursor:pointer}
button:hover,.tg:hover{border-color:var(--muted)}
button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tg{display:inline-flex;align-items:center;gap:4px}
.tg input{margin:0;accent-color:var(--accent)}
.legend{position:absolute;left:8px;bottom:8px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 8px;font-size:11.5px;max-width:calc(100% - 16px)}
.legend .bar{height:8px;width:180px;max-width:100%;border-radius:2px;margin:3px 0 1px}
.legend .ends{display:flex;justify-content:space-between;font-family:var(--f-mono)}
.legend .cats{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:5px}
.legend .cats span{display:inline-flex;align-items:center;gap:4px}
.legend .cats i{width:10px;height:10px;border-radius:2px;display:inline-block}
.timebar{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.timebar .when{font-size:16px;font-weight:600}
.timebar .when small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.timebar input{width:100%;accent-color:var(--accent)}
.timebar .now{grid-column:1/3;display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--muted)}
.timebar .now b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px}
.planwrap{position:relative;padding:8px 12px 12px}
#plan{width:100%;display:block;border-radius:4px;cursor:crosshair}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 8px;font-size:12px;line-height:1.45;box-shadow:0 2px 8px rgba(0,0,0,.12);min-width:150px}
.tip b{font-weight:600}
.chartwrap{padding:8px 12px 12px}
#chart{width:100%;height:220px;display:block}
.tablewrap{overflow:auto;max-height:340px;margin:8px 12px 12px;border:1px solid var(--line);border-radius:4px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:4px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{position:sticky;top:0;background:var(--sunk);font-weight:600;font-size:12px;color:var(--muted)}
th:first-child,td:first-child,th.lvls{text-align:left}
td.lvls{text-align:left;font-family:var(--f-body)}
tr.cur td{background:color-mix(in srgb,var(--accent) 14%,transparent)}
td.neg{color:var(--bad)}
.notes{padding:4px 12px 12px;font-size:12.5px;color:var(--muted)}
.notes ul{margin:6px 0 0;padding-left:18px;display:grid;gap:3px}
.notes b{color:var(--ink);font-weight:600}
.err{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--muted)}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr)}
  aside.inputs{position:static;max-height:none;order:2}
  main.work{order:1}
}
@media (max-width:480px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi .v{font-size:17px}.stage{height:56vh}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}

.filebar{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.btn{font:inherit;font-size:12.5px;color:var(--panel);background:var(--ink);border:1px solid var(--ink);border-radius:4px;padding:3px 10px;cursor:pointer;display:inline-block}
.btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.laywrap{margin-top:8px;border:1px solid var(--line);border-radius:4px;max-height:210px;overflow:auto}
table.lay{font-size:12px;table-layout:fixed;width:100%}
table.lay th:nth-child(1){width:42%}table.lay th:nth-child(3){width:86px}
table.lay td{overflow-wrap:anywhere;word-break:break-all}
.derived{overflow-wrap:anywhere}
table.lay td,table.lay th{padding:3px 6px;text-align:left;white-space:normal}
table.lay td.n{font-family:var(--f-mono);color:var(--muted);font-size:11px}
table.lay select{font-size:12px;padding:1px 3px;max-width:96px}
details.adv{border-top:1px solid var(--line);margin-top:10px;padding-top:6px}
details.adv>summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted);padding:2px 0}
details.adv fieldset:first-of-type{border-top:0}
.portalbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
#plan.pick{cursor:copy;outline:2px solid var(--accent);outline-offset:-2px}
#p-plan{width:100%;margin-top:6px;font-family:var(--f-mono);font-size:12.5px;line-height:1.5;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:5px 7px;resize:vertical}
.note2{font-size:11.5px;color:var(--muted);margin-top:3px}
.msg{font-size:12px;color:var(--bad);margin-top:6px}
.step{display:inline-block;width:18px;height:18px;line-height:18px;text-align:center;border-radius:50%;background:var(--ink);color:var(--panel);font-size:11px;font-family:var(--f-mono);margin-right:5px}
</style>
